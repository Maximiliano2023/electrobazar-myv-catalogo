
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/catalog"
  to = "/.netlify/functions/catalog"
  status = 200

[[redirects]]
  from = "/api/image"
  to = "/.netlify/functions/image"
  status = 200

[[redirects]]
  from = "/producto/*"
  to = "/"
  status = 302

[[redirects]]
  from = "/categoria/*"
  to = "/.netlify/functions/seo-page"
  status = 200
  
